<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Subir Propiedades</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="admin-container">
        <h1>Panel de Administración - Propiedades</h1>
        
        <form id="propiedadForm" class="property-form">
            <div class="form-group">
                <label for="nombre">Nombre de la propiedad:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de propiedad:</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Seleccionar...</option>
                    <option value="casa">Casa</option>
                    <option value="departamento">Departamento</option>
                    <option value="terreno">Terreno</option>
                    <option value="local">Local Comercial</option>
                    <option value="oficina">Oficina</option>
                </select>
            </div>

            <div class="form-group">
                <label for="precio">Precio:</label>
                <input type="number" id="precio" name="precio" required>
            </div>

            <div class="form-group">
                <label for="ubicacion">Ubicación:</label>
                <input type="text" id="ubicacion" name="ubicacion" required>
            </div>

            <div class="form-group">
                <label for="superficie">Superficie (m²):</label>
                <input type="number" id="superficie" name="superficie" required>
            </div>

            <div class="form-group">
                <label for="habitaciones">Habitaciones:</label>
                <input type="number" id="habitaciones" name="habitaciones" min="0">
            </div>

            <div class="form-group">
                <label for="banos">Baños:</label>
                <input type="number" id="banos" name="banos" min="0">
            </div>

            <div class="form-group">
                <label for="estacionamientos">Estacionamientos:</label>
                <input type="number" id="estacionamientos" name="estacionamientos" min="0">
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="imagenes">Imágenes de la propiedad:</label>
                <div class="image-upload-simple">
                    <input type="file" id="imagenes" name="imagenes" multiple accept="image/*" style="display: none;">
                    
                    <div class="upload-first-container" id="upload-first-container">
                        <button type="button" class="upload-first-btn" onclick="document.getElementById('imagenes').click()">
                            <div class="upload-icon">📷</div>
                            <span>Subir primera imagen</span>
                        </button>
                    </div>

                    <div class="images-container" id="images-container" style="display: none;">
                        <div class="images-grid" id="images-grid"></div>
                        <button type="button" class="add-more-btn" onclick="document.getElementById('imagenes').click()">
                            <span class="plus-icon">+</span> Agregar más imágenes
                        </button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="operacion">Tipo de operación:</label>
                <select id="operacion" name="operacion" required>
                    <option value="">Seleccionar...</option>
                    <option value="venta">Venta</option>
                    <option value="renta">Renta</option>
                </select>
            </div>

            <div class="form-group">
                <label for="identificador">Identificador de la propiedad:</label>
                <input type="text" id="identificador" name="identificador" required>
            </div>

            <div class="form-group">
                <label for="asesor">Asesor responsable:</label>
                <select id="asesor" name="asesor" required>
                    <option value="">Seleccionar asesor...</option>
                    <option value="gerardo">Gerardo García Martínez</option>
                    <option value="susana">Susana Maldonado Elizondo</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Publicar Propiedad</button>
        </form>

        <div class="properties-list">
            <h2>Propiedades Publicadas</h2>
            <div id="admin-properties-container"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
